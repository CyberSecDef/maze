<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Maze Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #gameCanvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
        }
        
        #topBar {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #roundInfo {
            font-size: 20px;
            font-weight: bold;
        }
        
        #scoreInfo {
            font-size: 18px;
        }
        
        #minimap {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid white;
            border-radius: 5px;
            padding: 5px;
        }
        
        #minimapCanvas {
            display: block;
        }
        
        #leaderboard {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 5px;
            min-width: 200px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        #leaderboard h3 {
            margin-bottom: 10px;
            border-bottom: 2px solid white;
            padding-bottom: 5px;
        }
        
        #leaderboard ol {
            list-style-position: inside;
            padding: 0;
        }
        
        #leaderboard li {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        #instructions h4 {
            margin-bottom: 8px;
        }
        
        #message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px 50px;
            border-radius: 10px;
            font-size: 24px;
            text-align: center;
            display: none;
            pointer-events: all;
        }
        
        #message.show {
            display: block;
        }
        
        button {
            margin-top: 15px;
            padding: 10px 30px;
            font-size: 18px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div id="topBar">
            <div id="roundInfo">Round: <span id="currentRound">1</span> / <span id="maxRounds">10</span></div>
            <div id="scoreInfo">Score: <span id="score">0</span></div>
        </div>
    </div>
    
    <div id="minimap">
        <canvas id="minimapCanvas" width="200" height="200"></canvas>
    </div>
    
    <div id="leaderboard">
        <h3>Leaderboard</h3>
        <ol id="leaderboardList"></ol>
    </div>
    
    <div id="instructions">
        <h4>Controls:</h4>
        <p>W/↑ - Move Forward</p>
        <p>S/↓ - Move Backward</p>
        <p>A/← - Turn Left</p>
        <p>D/→ - Turn Right</p>
        <p><br>Reach the goal (glowing square)!</p>
    </div>
    
    <div id="message"></div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
